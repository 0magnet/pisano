name: demo

# Build the browser demo and commit it to docs/, which is what GitHub Pages
# serves (the repo is configured main:/docs, legacy build — there is no Pages
# action in the chain).
#
# It existed only as web/build.sh run by hand before this, which meant the wasm
# on the site was whatever the last machine to run it produced. A dependency fix
# reached the demo only if someone remembered to rebuild, and one that shipped a
# real bug — a WebGL canvas sized 41px taller than the terminal it sat on —
# stayed live for weeks across five demos for exactly that reason.
on:
  push:
    branches: [main]
    # Only when something that changes the binary changes. docs/ is excluded so
    # this cannot answer its own commit.
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'scripts/tinygo-toolchain.sh'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

concurrency:
  # A second push while this is running would race to commit docs/. Newer wins;
  # the older run has nothing to say that the newer one does not.
  group: demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Go is pinned rather than taken from the runner, so the build is
      # reproducible. TinyGo is the 0magnet/tinygo toolchain release (its
      # develop branch, rebuilt on every push there): releases up to 0.42
      # cannot build against Go 1.27, whose hash/maphash reaches into
      # internal/runtime/maps for types TinyGo's internal/abi lacks, and the
      # fork carries the fix (tinygo-org/tinygo#5707).
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false

      - name: install TinyGo (0magnet/tinygo)
        run: |
          curl -sSfL https://github.com/0magnet/tinygo/releases/download/toolchain/tinygo.linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"

      - name: build the demo into docs/
        run: sh web/build.sh

      - name: commit docs/ if it changed
        run: |
          set -eu
          if git diff --quiet -- docs; then
            echo "docs/ unchanged; nothing to publish"
            exit 0
          fi
          # The committer is the workflow, not a person: a bot identity makes it
          # obvious in the log which commits are builds rather than edits.
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          # The marker below stops this build product from starting the whole
          # workflow set again for a tree whose source did not change.
          #
          # BEWARE writing that marker into a commit message that is not this
          # one: GitHub scans the whole message BODY for it, so a commit that
          # merely mentions it in prose silently skips every workflow. The
          # commit that added this file did exactly that and ran nothing.
          git commit -m 'docs: rebuild the browser demo [skip ci]'
          git push
